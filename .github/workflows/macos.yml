name: macOS Universal (古堡禁地 CHT)

# patch-only repo:CI 取 ScummVM v2.9.1 源碼 + 套 agos-cht.patch,自編 universal ScummVM.app。
# [HARD 踩雷] 只用 macos-14;x86_64 弧走 Rosetta(arch -x86_64)各編一次 + lipo;
# 自編 pinned SDL2 2.30.9(別 brew:2026 起 sdl2-compat→SDL3 黑畫面);LEAN 全 disable 外部庫
# (否則撿到 runner brew 的 arm64-only .a → x86_64 弧連結失敗);CXXFLAGS 當環境變數前綴;
# SDL2 dylib lipo 進 .app/Frameworks + install_name_tool + codesign。

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/macos.yml'
      - 'fonts/**'
      - 'translations/elvira1_zh.tab'

env:
  SV_TAG: v2.9.1
  SDL2_VER: 2.30.9
  MIN_MACOS: "11.0"
  # scummvm-static 規則用 $(OSX_STATIC_LIBS)(LEAN 下空), 核心 Cocoa 框架只在 $(LIBS) →
  # 加進 LDFLAGS(該規則用 $(LDFLAGS))。-lobjc 供 ARC 的 _objc_retain。
  OSX_FW: "-framework Cocoa -framework AudioUnit -framework AudioToolbox -framework Carbon -framework CoreMIDI -framework IOKit -lobjc"

jobs:
  build:
    runs-on: macos-14   # [HARD] macos-13(Intel)退役,只用 macos-14
    steps:
      - name: Checkout CHT repo (patch + fonts)
        uses: actions/checkout@v4

      - name: Fetch ScummVM ${{ env.SV_TAG }}
        run: git clone --depth 1 --branch "$SV_TAG" https://github.com/scummvm/scummvm.git sv

      - name: Apply agos-cht.patch
        run: cd sv && git apply --whitespace=nowarn ../patches/agos-cht.patch

      - name: Build pinned SDL2 ${{ env.SDL2_VER }} (both arches, dylib)
        run: |
          set -e
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
          tar xf sdl.tar.gz
          for A in arm64 x86_64; do
            rm -rf build-sdl-$A && mkdir build-sdl-$A && cd build-sdl-$A
            if [ "$A" = "x86_64" ]; then RUN="arch -x86_64"; else RUN=""; fi
            $RUN ../SDL2-${SDL2_VER}/configure --prefix="$GITHUB_WORKSPACE/sdl-$A" \
              --enable-shared --disable-static \
              CFLAGS="-arch $A -mmacosx-version-min=${MIN_MACOS}" \
              LDFLAGS="-arch $A -mmacosx-version-min=${MIN_MACOS}"
            $RUN make -j3 && $RUN make install
            cd ..
          done
          # 防呆:dylib >1MB(真 SDL2, 非 sdl2-compat shim)且不見 SDL3
          for A in arm64 x86_64; do
            sz=$(stat -f%z sdl-$A/lib/libSDL2-2.0.0.dylib)
            echo "SDL2 $A dylib size=$sz"
            [ "$sz" -gt 1000000 ] || { echo "!! SDL2 $A dylib 太小,疑似 shim"; exit 1; }
            otool -L sdl-$A/lib/libSDL2-2.0.0.dylib | grep -qi SDL3 && { echo "!! 連到 SDL3"; exit 1; } || true
          done

      - name: Build ScummVM per-arch (AGOS + CHT, LEAN)
        run: |
          set -e
          LEAN="--disable-mad --disable-vorbis --disable-flac --disable-fluidsynth --disable-fluidlite \
                --disable-mpeg2 --disable-theoradec --disable-faad --disable-libcurl --disable-a52 \
                --disable-mikmod --disable-gif --disable-jpeg --disable-png --disable-freetype2 \
                --disable-zlib --disable-tts --disable-discord --disable-sndio --disable-timidity \
                --disable-sparkle --disable-retrowave --disable-readline --disable-libunity"
          for A in arm64 x86_64; do
            if [ "$A" = "x86_64" ]; then RUN="arch -x86_64"; else RUN=""; fi
            ( cd sv && $RUN make distclean || true )
            # [HARD] CXXFLAGS/LDFLAGS 當環境變數前綴(ScummVM configure 非 autoconf)
            ( cd sv && PATH="$GITHUB_WORKSPACE/sdl-$A/bin:$PATH" \
                       CXXFLAGS="-arch $A -mmacosx-version-min=${MIN_MACOS}" \
                       LDFLAGS="-arch $A -mmacosx-version-min=${MIN_MACOS} $OSX_FW -L$GITHUB_WORKSPACE/sdl-$A/lib -lSDL2" \
              $RUN ./configure --disable-all-engines --enable-engine=agos --enable-release \
                   $LEAN --with-sdl-prefix="$GITHUB_WORKSPACE/sdl-$A" )
            grep -q USE_MT32EMU sv/config.h || { echo "!! MT32EMU 未啟用"; exit 1; }   # [HARD] 保留 MT-32
            ( cd sv && $RUN make -j3 scummvm-static )
            cp sv/scummvm-static "scummvm-$A"
            ( cd sv && $RUN make distclean || true )
          done
          # lipo universal 主程式
          lipo -create scummvm-arm64 scummvm-x86_64 -output scummvm-universal
          lipo -info scummvm-universal

      - name: Bundle ScummVM.app (universal)
        run: |
          set -e
          # 重新 configure arm64 只為 make bundle 產生 .app 骨架
          ( cd sv && PATH="$GITHUB_WORKSPACE/sdl-arm64/bin:$PATH" \
                     CXXFLAGS="-arch arm64 -mmacosx-version-min=${MIN_MACOS}" \
                     LDFLAGS="-arch arm64 -mmacosx-version-min=${MIN_MACOS} $OSX_FW -L$GITHUB_WORKSPACE/sdl-arm64/lib -lSDL2" \
            ./configure --disable-all-engines --enable-engine=agos --enable-release \
              --disable-mad --disable-vorbis --disable-flac --disable-fluidsynth --disable-fluidlite \
              --disable-mpeg2 --disable-theoradec --disable-faad --disable-libcurl --disable-a52 \
              --disable-mikmod --disable-gif --disable-jpeg --disable-png --disable-freetype2 \
              --disable-zlib --disable-tts --disable-discord --disable-sndio --disable-timidity \
              --disable-sparkle --disable-retrowave --disable-readline --disable-libunity \
              --with-sdl-prefix="$GITHUB_WORKSPACE/sdl-arm64" )
          ( cd sv && make -j3 scummvm-static && make bundle )
          APP=$(find sv -maxdepth 2 -name 'ScummVM.app' | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          # 換上 universal 主程式
          cp scummvm-universal "$APP/Contents/MacOS/scummvm"
          # [HARD] SDL2 dylib lipo → Frameworks + install_name_tool + codesign
          mkdir -p "$APP/Contents/Frameworks"
          lipo -create sdl-arm64/lib/libSDL2-2.0.0.dylib sdl-x86_64/lib/libSDL2-2.0.0.dylib \
               -output "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
          # universal 主程式的兩弧各自引用 sdl-arm64 / sdl-x86_64 路徑 → 兩個 old 路徑都要 -change
          # (install_name_tool -change 只改各弧內符合的 old;lipo 後 arm64 弧記 sdl-arm64、x86_64 弧記 sdl-x86_64)。
          NEW="@executable_path/../Frameworks/libSDL2-2.0.0.dylib"
          for A in arm64 x86_64; do
            install_name_tool -change "$GITHUB_WORKSPACE/sdl-$A/lib/libSDL2-2.0.0.dylib" "$NEW" "$APP/Contents/MacOS/scummvm" 2>/dev/null || true
          done
          # 保險:若還有其他 libSDL2 old 路徑(otool 顯示的第一個非 @ 路徑)也改
          OLD=$(otool -L "$APP/Contents/MacOS/scummvm" | grep -i libSDL2 | awk '{print $1}' | grep -v '^@' | head -1 || true)
          [ -n "$OLD" ] && install_name_tool -change "$OLD" "$NEW" "$APP/Contents/MacOS/scummvm" || true
          # [HARD] dylib 自己的 LC_ID_DYLIB 也要改 —— lipo 後兩弧各記 sdl-arm64/sdl-x86_64 的
          # runner 路徑。主程式走 @executable_path 不看 ID(功能不受影響), 但 HARD 規則要求
          # 產物無 runner 殘留, 且未來若 re-link 會用到 ID。放連結後、codesign 前改(連結前改
          # 會破壞 configure 的 SDL2 runtime 測試)。
          install_name_tool -id "$NEW" "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
          codesign --force --sign - "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
          codesign --force --sign - "$APP/Contents/MacOS/scummvm"
          # 驗證:雙弧 + 無殘留路徑(dylib ID + 主程式 load 皆不得見 /Users/runner)
          lipo -info "$APP/Contents/MacOS/scummvm"
          lipo -info "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
          if otool -D "$APP/Contents/Frameworks/libSDL2-2.0.0.dylib" | grep -q '/Users/runner'; then
            echo "!! FATAL: SDL2 dylib LC_ID_DYLIB 仍含 runner 路徑"; exit 1
          fi
          if otool -L "$APP/Contents/MacOS/scummvm" | grep -i libSDL2 | grep -q '/Users/runner'; then
            echo "!! FATAL: 主程式 SDL2 load 仍含 runner 路徑"; exit 1
          fi
          echo "✓ 無 runner 路徑殘留"
          if otool -L "$APP/Contents/MacOS/scummvm" | grep -q "/Users/runner"; then
            echo "!! 殘留 runner 路徑:"; otool -L "$APP/Contents/MacOS/scummvm" | grep "/Users/runner"; exit 1
          fi

      - name: Add CHT assets + 使用說明
        run: |
          set -e
          # 繁中字型/譯表放在 .app 旁的資料夾, 玩家需複製進「自己的 Elvira 遊戲夾」(引擎從遊戲夾載入)。
          mkdir -p 繁中字型
          cp fonts/elvira1_zh14.dcjk fonts/elvira1_zh16.dcjk fonts/elvira1_zh24.dcjk \
             translations/elvira1_zh.tab 繁中字型/
          {
            printf '古堡禁地 (Elvira 1, 1990) 繁體中文版 — macOS (universal, Apple Silicon + Intel)\n'
            printf '安裝:\n'
            printf '1. 對 ScummVM.app 按右鍵 → 打開(首次繞過 Gatekeeper)。\n'
            printf '2. 把你合法擁有的 Elvira (Floppy/DOS) 全部檔案放進一個資料夾(以下稱「遊戲夾」)。\n'
            printf '3. [重要] 把本包「繁中字型/」內的 4 個檔複製進你的「遊戲夾」(要和 gamepc/tables01 等原檔同夾, 引擎才載得到中文)。\n'
            printf '4. 想要 MT-32 原版配樂: 也把 MT32_CONTROL.ROM / MT32_PCM.ROM 放進遊戲夾。\n'
            printf '5. 開 ScummVM.app → Add Game → 指向遊戲夾 → Graphics 設 Scaler=Normal, Scale=2x(繁中疊層為 640x400 設計;放大用全螢幕)。\n'
            printf '熱鍵: F7 無敵, TAB 地圖; 存檔 Alt+數字, 讀檔 Ctrl+數字。\n'
          } > 使用說明.txt

      - name: Package tar.gz + dmg
        run: |
          set -euo pipefail
          # 收成一個發佈夾(ScummVM.app + 繁中字型 + 使用說明)
          rm -rf release && mkdir -p release
          cp -R "$APP" release/
          cp -R 繁中字型 release/
          cp 使用說明.txt release/
          # [HARD] tar.gz 繞 APFS,是主要交付
          tar czf 古堡禁地-CHT-macos-universal.tar.gz -C release .
          # .dmg 用 hdiutil,偶發 "Resource busy" → 重試數次;仍失敗不中止(tar.gz 已足夠)
          for try in 1 2 3 4 5; do
            if hdiutil create -volname "古堡禁地 CHT" -srcfolder release -ov -format UDZO \
                 古堡禁地-CHT-macos-universal.dmg; then
              echo "✓ dmg 建立成功(第 $try 次)"; break
            fi
            echo "dmg 建立失敗(第 $try 次,Resource busy?),等 10s 重試…"; sleep 10
          done
          [ -f 古堡禁地-CHT-macos-universal.dmg ] || echo "!! dmg 最終未建成,只出 tar.gz(可接受)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 古堡禁地-CHT-macos-universal
          if-no-files-found: warn
          path: |
            古堡禁地-CHT-macos-universal.tar.gz
            古堡禁地-CHT-macos-universal.dmg
